<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My To-Do List App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- App Heading -->
      <h1>My To-Do List</h1>
      <p class="subtitle">Organize your daily tasks easily!</p>

      <!-- Add Task -->
      <div class="input-section">
        <input type="text" id="taskInput" placeholder="Enter a new task" />

        <button id="addTaskBtn">Add Task</button>
      </div>

      <!-- Task Counter -->
      <div class="task-stats">
        <p>
          Total Tasks:
          <span id="totalTasks">0</span>
        </p>

        <p>
          Completed:
          <span id="completedTasks">0</span>
        </p>
      </div>

      <!-- Task List -->
      <ul id="taskList"></ul>

      <!-- Empty Message -->
      <p id="emptyMessage">No tasks yet. Add your first task!</p>

      <!-- Clear All Button -->
      <button id="clearAllBtn">Clear All Tasks</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
